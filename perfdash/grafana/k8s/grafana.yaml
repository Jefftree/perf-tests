# Grafana: reads perfdash_value samples from VictoriaMetrics through the
# Prometheus-compatible API and renders the perfdash dashboard.
#
# Three ConfigMaps back this Deployment:
#   grafana-datasources  - the "VictoriaMetrics" Prometheus datasource (uid victoriametrics)
#   grafana-dashboard-provider - the file provider that loads dashboards from disk
#   grafana-dashboard-perfdash - the dashboard JSON itself
#
# The datasource and provider ConfigMaps are defined inline below so this file
# is self-contained. The dashboard JSON is large, so it is created out-of-band
# from the checked-in source:
#
#   kubectl -n perfdash create configmap grafana-dashboard-perfdash \
#     --from-file=perfdash.json=perfdash/grafana/dashboards/perfdash.json \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Runs alongside the legacy perfdash Deployment, it does not replace it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: perfdash
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoriametrics:8428
        isDefault: true
        jsonData:
          httpMethod: POST
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: perfdash
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: perfdash
        type: file
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: perfdash
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: perfdash
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_USERS_DEFAULT_THEME
              value: "light"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-perfdash
            items:
              - key: perfdash.json
                path: perfdash.json
